[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "modoc-ai-pipeline"
version = "0.1.0"
description = "Semi-automated MoDoc Q&A to short-form script pipeline MVP"
requires-python = ">=3.10"
dependencies = [
    "google-genai>=1.0.0",
    "openpyxl>=3.1.0",
    "Pillow>=10.0.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
meme = ["edge-tts>=7.0.0"]

[tool.setuptools.packages.find]
where = ["src"]
